name: Apply player bar fix

on:
  push:
    paths:
      - .github/player-bar-fix.patch
      - .github/workflows/apply-player-bar-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/player-bar-fix.patch ]; then
            echo "Patch already applied."
            exit 0
          fi
          if [ -n "$(tail -c 1 .github/player-bar-fix.patch)" ]; then
            printf '\n' >> .github/player-bar-fix.patch
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --whitespace=nowarn .github/player-bar-fix.patch
          rm -f .github/player-bar-fix.patch
          rm -f .github/workflows/apply-player-bar-fix.yml
          git add -A
          git commit -m "fix: 修复播放栏封面撑高与沉浸页退出状态"
          git push origin HEAD:main
