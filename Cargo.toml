[package]
name = "bili-music"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "轻量原生 Linux Bilibili 音频播放器"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
gstreamer = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
url = "2"
async-channel = "2"
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
